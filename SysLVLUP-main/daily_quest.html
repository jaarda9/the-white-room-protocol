<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Quests</title>
    <link rel="stylesheet" href="css/daily_quest.css" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#4a90e2">
    
    <!-- iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SysLVLUP">
    
    <!-- Microsoft -->
    <meta name="msapplication-TileImage" content="icons/icon-144x144.png">
    <meta name="msapplication-TileColor" content="#4a90e2">
    <meta name="msapplication-tap-highlight" content="no">
    
    <!-- Icons -->
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-152x152.png">
    <link rel="icon" type="image/png" href="icons/icon-192x192.png" sizes="192x192">
  </head>
  <body>
    <!-- Status Page Button -->
    <div class="navigation">
      <a href="status.html" class="back-link">
        ← Back to Status
      </a>
    </div>
    
    <div class="quest-box" id="quest-box">
      <div class="quest-header">
        <span>ⓘ Daily Quests</span>
      </div>
      <div class="quest-details">
        <p>[Daily Quest: Training has arrived.]</p>
      </div>
      <div class="goal-section">
        <h2>GOAL</h2>

        <!-- MENTAL TRAINING -->
        <div class="goal-item goal-category">
          <span class="task-name">Mental Training</span>
          <div class="task-right">
            <span id="mentalQuests">[0/6]</span>
          </div>
          <div>
            <input type="checkbox" id="mental-checkbox" class="mental-checkbox" disabled />
          </div>
        </div>
        <div class="goal-subtasks" id="mental-subtasks">
          <label class="subtask"><input type="checkbox" id="mental-geo" /> 15 Min Geography Study</label>
          <label class="subtask"><input type="checkbox" id="mental-history" /> 15 Min History Study</label>
          <label class="subtask"><input type="checkbox" id="mental-study1" /> Study Session 1 (45 Min)</label>
          <label class="subtask"><input type="checkbox" id="mental-study2" /> Study Session 2 (45 Min)</label>
          <label class="subtask"><input type="checkbox" id="mental-study3" /> Study Session 3 (45 Min)</label>
          <label class="subtask"><input type="checkbox" id="mental-study4" /> Study Session 4 (45 Min)</label>
        </div>

        <!-- PHYSICAL TRAINING -->
        <div class="goal-item goal-category">
          <span class="task-name">Physical Training</span>
          <div class="task-right" id="taskRight">
            <span id="physicalQuests">[0/1]</span>
          </div>
          <div>
            <input type="checkbox" id="physical-checkbox" class="physical-checkbox" disabled />
          </div>
        </div>
        <div class="goal-subtasks" id="physical-subtasks">
          <label class="subtask"><input type="checkbox" id="physical-workout" /> 30 Min Home Workout</label>
          <span class="subtask-hint">(Pushups/Pullups/Squats or Dumbbells Bicep/Tricep/Shoulder/Calves)</span>
        </div>

        <!-- SPIRITUAL TRAINING -->
        <div class="goal-item goal-category">
          <span class="task-name">Spiritual Training</span>
          <div class="task-right">
            <span id="spiritualQuests">[0/3]</span>
          </div>
          <div>
            <input type="checkbox" id="spiritual-checkbox" class="spiritual-checkbox" disabled />
          </div>
        </div>
        <div class="goal-subtasks" id="spiritual-subtasks">
          <label class="subtask"><input type="checkbox" id="spiritual-morning" /> Morning Adhkar</label>
          <label class="subtask"><input type="checkbox" id="spiritual-evening" /> Evening Adhkar</label>
          <label class="subtask"><input type="checkbox" id="spiritual-witr" /> Witr Salah</label>
        </div>
      </div>
      <div class="warning-section">
        <p>
          WARNING: Failure to complete the daily quest will result in an
          appropriate <span class="penalty">penalty</span>
        </p>
      </div>

      <div class="complete-section" id="complete-section">
        <input type="checkbox" id="complete" disabled />
        <label for="complete"></label>
      </div>
    </div>

    <!-- Load scripts in correct order -->
    <script src="js/user-manager.js"></script>
    <script src="js/daily_quest.js"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
    
    <!-- THE ARCHITECT'S GLOBAL CONSCIOUSNESS -->
    <script src="js/architect-global.js"></script>
</body>
</html>
